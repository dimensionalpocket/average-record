[workspace]
members = ["rust/average-record", "rust/average-record-derive"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/dimensionalpocket/average-record"

[workspace.dependencies]
average-record-derive = { path = "rust/average-record-derive" }
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
garde = { version = "0.23", default-features = false, features = ["derive"] }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1"
