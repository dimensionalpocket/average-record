name: Rust Tests

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - '.tool-versions'
      - '.github/workflows/rust-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - '.tool-versions'
      - '.github/workflows/rust-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Rust version
        id: rust
        run: echo "version=$(awk '$1=="rust"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ steps.rust.outputs.version }}" --profile minimal --component clippy --component rustfmt
          rustup default "${{ steps.rust.outputs.version }}"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features
